<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cb85c"/>
      <stop offset="100%" stop-color="#2d7a2d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="60" height="60" rx="14"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- Top sheen -->
  <rect width="60" height="30" rx="14" fill="url(#sheen)" clip-path="url(#c)"/>
  <!-- Border -->
  <rect width="60" height="60" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Android robot — centered -->
  <g transform="translate(13, 10)" fill="white">
    <!-- Left antenna -->
    <line x1="9" y1="10" x2="4" y2="4" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- Right antenna -->
    <line x1="25" y1="10" x2="30" y2="4" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- Antenna dots -->
    <circle cx="4" cy="3.5" r="1.8" fill="white"/>
    <circle cx="30" cy="3.5" r="1.8" fill="white"/>
    <!-- Head -->
    <path d="M5 10 Q5 4 17 4 Q29 4 29 10 Z"/>
    <!-- Eyes -->
    <circle cx="12" cy="8" r="1.5" fill="#2d7a2d"/>
    <circle cx="22" cy="8" r="1.5" fill="#2d7a2d"/>
    <!-- Body -->
    <rect x="3" y="12" width="28" height="18" rx="4"/>
    <!-- Left arm -->
    <rect x="-3" y="12" width="5" height="13" rx="2.5"/>
    <!-- Right arm -->
    <rect x="32" y="12" width="5" height="13" rx="2.5"/>
    <!-- Left leg -->
    <rect x="7" y="31" width="5" height="10" rx="2.5"/>
    <!-- Right leg -->
    <rect x="22" y="31" width="5" height="10" rx="2.5"/>
  </g>
</svg>
